{{template "head" .}}<main class="auth-wrap"><section class="auth-card"><h1>Смена пароля</h1>{{if .User.MustChangePassword}}<p>Перед началом работы замените временный пароль.</p>{{end}}<p class="muted">Не менее 8 символов, не более 72 байт.</p>{{template "error" .}}<form method="post" action="/password" class="stack"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label>Текущий пароль<input name="old_password" type="password" autocomplete="current-password" required></label><label>Новый пароль<input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label><button class="button primary" type="submit">Сменить пароль</button></form></section></main>{{template "foot" .}}
