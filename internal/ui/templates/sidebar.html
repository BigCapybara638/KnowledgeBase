{{define "sidebar"}}<aside class="sidebar" aria-label="Категории и статьи"><a class="nav-all" href="/">▦ Все статьи</a><div class="sidebar-label">КАТЕГОРИИ</div>{{range .Categories}}<details class="category-group" open><summary hx-get="/categories/{{.ID}}/articles{{with $.CurrentArticleID}}?current={{.}}{{end}}" hx-trigger="load" hx-target="#category-{{.ID}}"><span>▸</span> {{.Title}}</summary><div id="category-{{.ID}}" class="category-articles"><span class="muted">Загрузка…</span></div></details>{{else}}<p class="muted">Категории пока не созданы.</p>{{end}}{{if eq .User.Role "admin"}}<a class="sidebar-manage" href="/admin/categories">＋ Управление категориями</a>{{end}}</aside>{{end}}
