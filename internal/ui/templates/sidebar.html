{{define "sidebar"}}<aside class="sidebar" aria-label="Категории и статьи"><a class="nav-all" href="/">▦ Все статьи</a><div class="sidebar-label">КАТЕГОРИИ</div>{{range .Categories}}<details class="category-group" open><summary hx-get="/categories/{{.ID}}/articles{{with $.CurrentArticleID}}?current={{.}}{{end}}" hx-trigger="load" hx-target="#category-{{.ID}}"><span>▸</span><span class="category-title">{{.Title}}</span><button type="submit" class="category-add" form="category-create-{{.ID}}" aria-label="Добавить статью в категорию «{{.Title}}»" title="Добавить статью в категорию «{{.Title}}»"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></summary><form id="category-create-{{.ID}}" action="/drafts" method="post" hidden><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><input type="hidden" name="category_id" value="{{.ID}}"></form><div id="category-{{.ID}}" class="category-articles"><span class="muted">Загрузка…</span></div></details>{{else}}<p class="muted">Категории пока не созданы.</p>{{end}}{{if eq .User.Role "admin"}}<a class="sidebar-manage" href="/admin/categories">＋ Управление категориями</a>{{end}}</aside>{{end}}
