{{define "sidebar"}}<aside class="sidebar" aria-label="Категории и статьи"><div class="sidebar-label">ПРОСТРАНСТВО КОМАНДЫ</div><a class="nav-all" href="/">▦ Все статьи</a><div class="sidebar-label">КАТЕГОРИИ</div>{{range .Categories}}<details class="category-group"><summary hx-get="/categories/{{.ID}}/articles" hx-trigger="click once" hx-target="#category-{{.ID}}"><span>▸</span> {{.Title}}</summary><div id="category-{{.ID}}" class="category-articles"><span class="muted">Загрузка…</span></div><a class="category-filter" href="/?category={{.ID}}">Все статьи категории →</a></details>{{else}}<p class="muted">Категории пока не созданы.</p>{{end}}{{if eq .User.Role "admin"}}<a class="sidebar-manage" href="/admin/categories">＋ Управление категориями</a>{{end}}<div class="sidebar-note">Знания, которые всегда под рукой.</div></aside>{{end}}
