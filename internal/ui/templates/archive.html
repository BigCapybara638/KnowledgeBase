{{template "head" .}}<main class="content-wide"><div class="page-heading"><div><h1>Архив статей</h1></div><a class="button" href="/admin/categories">Категории</a></div><section class="panel">{{range .Articles}}<div class="category-admin-row"><div><h2>{{.Title}}</h2><p class="muted">{{.CategoryTitle}} · {{.AuthorName}}</p></div><form action="/articles/{{.ID}}/archive" method="post"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><input type="hidden" name="version" value="{{.Version}}"><input type="hidden" name="archived" value="false"><button class="button">Восстановить</button></form></div>{{else}}<p class="muted">Архив пуст.</p>{{end}}</section></main>{{template "foot" .}}
