{{define "head"}}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRFToken}}"><title>{{.Title}} · База знаний</title><link rel="stylesheet" href="/static/dist/app.css"><script type="module" src="/static/dist/app.js"></script></head><body>{{if .User.ID}}<header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/static/axentris.svg" alt="Axentris"></a><form action="/search" method="get" class="search-form"><input name="q" maxlength="256" value="{{.Query}}" placeholder="Поиск по базе знаний" aria-label="Поиск по базе знаний"><button type="submit">Найти</button></form><nav class="account-nav"><a href="/settings/mcp">Доступ агента</a><a href="/drafts">Мои черновики</a>{{if eq .User.Role "admin"}}<a href="/admin/users">Управление</a>{{end}}<a href="/password">{{.User.Name}}</a><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button type="submit" class="link-button">Выйти</button></form></nav></header>{{end}}{{end}}
{{define "foot"}}<div id="toast" role="status" aria-live="polite"></div></body></html>{{end}}
{{define "error"}}{{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}{{end}}
