{{template "head" .}}<main class="auth-wrap"><section class="auth-card"><span class="eyebrow">КОМАНДНАЯ БАЗА ЗНАНИЙ</span><h1>Добро пожаловать</h1><p class="muted">Войдите с учётной записью, которую выдал администратор.</p>{{template "error" .}}<form method="post" action="/login" class="stack"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><input type="hidden" name="return_to" value="{{.ReturnTo}}"><label>Логин<input name="login" autocomplete="username" required autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button class="button primary" type="submit">Войти</button></form></section></main>{{template "foot" .}}
