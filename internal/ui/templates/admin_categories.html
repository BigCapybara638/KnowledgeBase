{{template "head" .}}<main class="content-wide"><div class="page-heading"><div><span class="eyebrow">АДМИНИСТРИРОВАНИЕ</span><h1>Категории</h1></div><a class="button" href="/admin/users">Сотрудники</a></div><section class="panel"><h2>Новая категория</h2><form method="post" action="/admin/categories" class="inline-form"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label>Название<input name="title" required maxlength="256"></label><label>Порядок<input name="order" type="number" value="0"></label><button class="button primary">Создать категорию</button></form></section><section class="panel"><h2>Категории базы</h2>{{range .Categories}}<div class="category-admin-row"><form method="post" action="/admin/categories/{{.ID}}" class="inline-form"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><input type="hidden" name="version" value="{{.Version}}"><input name="title" value="{{.Title}}" aria-label="Название категории" required><input name="order" type="number" value="{{.Order}}" aria-label="Порядок категории"><button class="button">Сохранить</button></form><form method="post" action="/admin/categories/{{.ID}}/delete"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><input type="hidden" name="version" value="{{.Version}}"><button class="button danger">Удалить пустую</button></form></div>{{else}}<p class="muted">Добавьте первую категорию для статей команды.</p>{{end}}</section><a class="link" href="/admin/archive">Архив статей →</a></main>{{template "foot" .}}
