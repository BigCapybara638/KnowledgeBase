{{range .Menu.Items}}<a class="sidebar-article" href="/articles/{{.ID}}">{{.Title}}</a>{{else}}<span class="muted">Нет опубликованных статей</span>{{end}}{{if .Menu.Next}}<button class="link-button" hx-get="/categories/{{.CategoryID}}/articles?cursor={{.Menu.Next}}" hx-target="this" hx-swap="outerHTML">Показать ещё</button>{{end}}
