{{range .Menu.Items}}<a class="sidebar-article" href="/articles/{{.ID}}"{{if eq .ID $.CurrentArticleID}} aria-current="page"{{end}}>{{.Title}}</a>{{else}}<span class="muted">Нет опубликованных статей</span>{{end}}{{if .Menu.Next}}<button class="link-button" hx-get="/categories/{{.CategoryID}}/articles?cursor={{.Menu.Next}}{{with .CurrentArticleID}}&current={{.}}{{end}}" hx-target="this" hx-swap="outerHTML">Показать ещё</button>{{end}}
