# Merge into the EXISTING proxy project's Compose file; do not replace it.
# Replace nginx with its real service name. Preserve ALL existing networks.
services:
  nginx:
    networks:
      - app-network # Axentris: preserve its existing network and settings.
      - knowledgebase-ingress
    volumes:
      # ADD this mount to the existing SSL/log mounts; do not replace them.
      - ./nginx-vhosts:/etc/nginx/vhosts:ro
networks:
  # Keep your existing app-network definition unchanged.
  knowledgebase-ingress:
    external: true
    name: knowledgebase-ingress
