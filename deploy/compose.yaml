name: knowledgebase
services:
  knowledgebase-app:
    image: ${KB_IMAGE:-knowledgebase:local}
    restart: unless-stopped
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    memswap_limit: 768m
    stop_grace_period: 30s
    environment:
      KB_PUBLIC_URL: ${KB_PUBLIC_URL:?Set the HTTPS origin of your knowledge base}
      KB_DATA_DIR: /data
      KB_BACKUP_DIR: /backups
      KB_LISTEN_ADDR: ':8080'
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    volumes:
      - ./data:/data
      - ./backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    healthcheck:
      test: [CMD, /app/kb, check]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      ingress:
        aliases: [knowledgebase-app]
networks:
  ingress:
    external: true
    name: ${KB_NETWORK_NAME:-knowledgebase-ingress}
