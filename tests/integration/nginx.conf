events {}
http {
    access_log off;
    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /tls/cert.pem;
        ssl_certificate_key /tls/key.pem;
        location = /client/health {
            proxy_pass http://app:80;
        }
        include /etc/nginx/knowledgebase-location.conf;
    }
}
